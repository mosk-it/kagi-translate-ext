<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="shared-styles.css" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 14px;
        line-height: 1.4;
        color: var(--text-color);
        background-color: var(--bg-color);
      }
      h2 {
        color: var(--accent-color);
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 10px;
        margin-bottom: 20px;
      }
      .setting-section {
        margin-bottom: 20px;
        background-color: var(--popup-bg);
        padding: 10px;
        border-radius: 5px;
        align-items: center;
      }
      .setting-section-inline {
        margin-bottom: 20px;
        background-color: var(--popup-bg);
        padding: 10px;
        border-radius: 5px;
        display: inline;
      }
      label {
        display: block;
        font-weight: 500;
      }
      .label-inline {
        display: inline;
        font-weight: 500;
      }
      .language-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
        gap: 10px;
      }
      .language-checkbox {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-top: 5px;
      }
      select {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--border-color);
        border-radius: 3px;
        background-color: var(--popup-bg);
        color: var(--text-color);
        font-family: sans-serif;
        font-size: 13px;
      }
      /* Some browsers allow limited option styling */
      option {
        background-color: var(--popup-bg);
        color: var(--text-color);
        font-family: sans-serif;
      }
      textarea {
        width: 100%;
        min-height: 100px;
        padding: 8px;
        border: 1px solid var(--border-color);
        border-radius: 3px;
        background-color: var(--popup-bg);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        resize: vertical; /* or 'none', 'both', 'horizontal' */
        outline-color: var(--accent-color);
        box-sizing: border-box;
      }
      .buttons {
        color: var(--text-color);
        background-color: var(--accent-color);
        border: none;
        padding: 12px 20px;
        border-radius: 3px;
      }
      input[type="password"] {
        width: 95%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid var(--border-color);
        border-radius: 3px;
      }
      #advancedToggle {
        cursor: pointer;
      }
      #saveSettings {
        background-color: var(--accent-color);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 3px;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      #saveSettings:hover {
        opacity: 0.9;
      }
      #status {
        margin-top: 10px;
        padding: 10px;
        border-radius: 3px;
      }
      .success {
        background-color: var(--popup-bg);
        color: var(--text-color);
        border-left: 4px solid rgba(76, 175, 80, 0.3);
        opacity: 0.9;
      }
      .error {
        background-color: var(--popup-bg);
        color: var(--text-color);
        border-left: 4px solid rgba(244, 67, 54, 0.3);
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Kagi Translate Settings</h2>

      <div class="setting-section">
        <h3>Account</h3>
        <h3>You need to log in to</h3>
        <a href="https://translate.kagi.com/" target="_blank"
          >translate.kagi.com</a
        >
      </div>

      <div class="setting-section">
        <h3>Languages Visible in Full Popup :</h3>

        <div id="languageGrid" class="language-grid"></div>
        <br />
        <button class="buttons" id="showAllLangs">Show All Languages</button>
      </div>
      <br />

      <div class="setting-section">
        <h3>Popup Behavior</h3>
        <input type="checkbox" id="autoTranslateOnPopup" />
        <label class="label-inline" for="autoTranslateOnPopup"
          >Auto-translate when popup opens</label
        ><br />
      </div>
      <div class="setting-section">
        <h3>Selection Behaviour</h3>

        <label>After selecting text</label>
        <label class="label-inline"
          ><input
            type="radio"
            id="selectionActionBubble"
            name="selectionAction"
            value="bubbleIcon"
          />
          Show bubble icon, click to translate</label
        ><br />
        <label class="label-inline"
          ><input
            type="radio"
            id="selectionActionInlinePopup"
            name="selectionAction"
            value="selectPopup"
          />Auto translate after selection </label
        ><br />
        <label class="label-inline"
          ><input
            type="radio"
            id="selectionActionNothing"
            name="selectionAction"
            value=""
          />Do nothing</label
        >
      </div>

      <div class="setting-section">
        <h3>Auto Detection</h3>
        <label for="autoDetectLangTo">Primary language:</label>
        <select name="autoDetectLangTo" id="autoDetectLangTo">
          <option value="">Pick language</option></select
        ><br /><br />

        <label for="autoDetectLangToAlt"
          >Fallback language (used if source is in primary language):</label
        >
        <select name="autoDetectLangToAlt" id="autoDetectLangToAlt">
          <option value="">Pick language</option>
        </select>
      </div>

      <div class="setting-section">
        <h3>UI</h3>

        <label class="label-inline"
          ><input
            type="radio"
            class="theme-radio"
            id="themeAuto"
            name="theme"
            value="auto"
          />auto</label
        >
        <label class="label-inline"
          ><input
            type="radio"
            class="theme-radio"
            id="themeDark"
            name="theme"
            value="dark"
          />dark
        </label>
        <label class="label-inline"
          ><input
            type="radio"
            class="theme-radio"
            id="themeLight"
            name="theme"
            value="light"
          />light</label
        >
      </div>
      <div class="setting-section advanced-section">
        <h3 id="advancedToggle">[+] Advanced Settings</h3>
        <div id="advancedContent" style="display: none">
          <label for="customCSS">Custom CSS for select popup:</label><br />
          <textarea id="customCSS" rows="6" cols="50"></textarea><br /><br />
          <button id="resetCSS">Reset CSS to Default</button>
        </div>
      </div>

      <button class="buttons" id="saveSettings">Save Settings</button>
      <div id="status"></div>
      <script type="module" src="options.js"></script>
    </div>
  </body>
</html>
